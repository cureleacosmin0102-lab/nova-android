name: Build Nova Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Nova" "com.nova.asistent" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Force single Kotlin stdlib version
        run: |
          cat << 'EOF' >> android/build.gradle

          subprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
            }
          }
          EOF

      - name: Build Android App Bundle (.aab) and Debug APK (.apk)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAB and APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk

